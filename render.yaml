# One-click deployment of the beta; credentials are generated by Render.
services:
  - type: web
    name: clipador-ia-felipe
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/Felipebuen89/laboratorio-ia
    branch: main
    dockerfilePath: ./apps/clipador-ia/Dockerfile.render
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: CLIPADOR_PUBLIC_MODE
        value: "1"
      - key: CLIPADOR_AUTH_USER
        value: felipe
      - key: CLIPADOR_AUTH_PASSWORD
        generateValue: true
      - key: CLIPADOR_WHISPER_MODEL
        value: tiny
      - key: CLIPADOR_MAX_SECONDS
        value: "1200"
      - key: CLIPADOR_MAX_BYTES
        value: "100000000"
      - key: CLIPADOR_HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
