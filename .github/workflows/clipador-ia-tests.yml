name: Clipador IA - testes de logica e render

on:
  push:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  pull_request:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clipador-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "Pillow>=10,<13"
      - name: Check FFmpeg
        run: ffmpeg -version
      - name: Check syntax
        run: python -m compileall -q engine.py ui.py
      - name: Unit tests and render smoke test
        run: python -m pytest -q tests
