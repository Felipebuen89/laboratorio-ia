name: Clipador IA - testes de logica, render e interface

on:
  push:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  pull_request:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  workflow_dispatch:

concurrency:
  group: clipador-ia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clipador-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "Pillow>=10,<13"
      - name: Check syntax and bash scripts
        run: |
          python -m compileall -q engine.py advanced.py ui.py
          bash -n scripts/setup.sh scripts/start.sh
          python -m json.tool ../../.devcontainer/clipador-ia/devcontainer.json > /dev/null
      - name: Unit tests and render smoke test
        run: python -m pytest -q tests

  interface-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clipador-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Simulate Codespaces postCreateCommand
        run: bash scripts/setup.sh
      - name: Simulate Codespaces postStartCommand and check HTTP 200
        run: |
          bash scripts/start.sh
          .venv/bin/python -c "import ui; assert ui.demo is not None"
          .venv/bin/python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).status == 200"
          echo "Codespaces startup smoke test completed: HTTP 200"
      - name: Show startup logs if failed
        if: failure()
        run: tail -100 .runtime/server.log || true
      - name: Stop local test server
        if: always()
        run: |
          if [ -f .runtime/server.pid ]; then kill "$(cat .runtime/server.pid)" 2>/dev/null || true; fi
