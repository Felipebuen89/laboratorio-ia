name: Clipador IA - testes de logica

on:
  push:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  pull_request:
    paths:
      - "apps/clipador-ia/**"
      - ".github/workflows/clipador-ia-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clipador-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check syntax
        run: python -m compileall -q engine.py ui.py
      - name: Unit tests
        run: python -m pytest -q tests
